services:
  mongodb:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
  backend:
    build: ./backend
    environment:
      MONGODB_URI: mongodb://mongodb:27017/shresth_products_analyzer
      PORT: 5000
    ports: ["5000:5000"]
  ai-service:
    build: ./ai-service
    ports: ["8000:8000"]
volumes:
  mongo_data:
